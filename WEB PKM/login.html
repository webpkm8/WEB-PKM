<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Web PKM</title>
<link rel="icon" type="image/png" href="ikon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
<script src="site-config.js"></script>
<script src="auth.js"></script>
<style>.helper-text{display:block;color:#748378;font-size:10px;line-height:1.4;margin-top:5px}</style>
</head>
<body>
<main class="login-page">
  <div class="brand"><img src="logo.png" alt="Web PKM" class="brand"></div>
  <div class="illustration"><img src="ikon login.png" alt="Login" class="illustration"></div>
  <section class="login-header">
    <h1>Selamat <span>Datang!</span></h1>
    <p>Silahkan login untuk melanjutkan ke akun anda</p>
  </section>
  <form class="login-card" id="loginForm" novalidate>
    <div class="form-group login-type-group">
      <label>Login sebagai</label>
      <div class="login-type-options" role="group" aria-label="Pilih jenis akun">
        <button type="button" class="login-type active" data-login-role="owner" aria-pressed="true">Owner Usaha</button>
        <button type="button" class="login-type" data-login-role="umkm" aria-pressed="false">UMKM</button>
      </div>
      <small class="helper-text" id="loginRoleHelper">Owner cukup menggunakan email dan password. Tidak perlu kode usaha.</small>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <div class="input-wrapper">
        <span class="input-icon">✉</span>
        <input type="email" id="email" name="email" placeholder="Masukan email anda" autocomplete="email">
      </div>
      <small class="error-message" id="emailError"></small>
    </div>
    <div class="form-group" id="businessCodeGroup" hidden>
      <label for="businessCode">Kode Usaha</label>
      <div class="input-wrapper"><span class="input-icon">⌘</span><input type="text" id="businessCode" placeholder="Masukkan kode usaha Owner" autocomplete="off" autocapitalize="characters"></div>
      <small class="helper-text" id="businessCodeHelper">Masukkan kode usaha milik Owner yang menghubungkan akun UMKM ini.</small>
      <small class="error-message" id="businessCodeError"></small>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrapper">
        <span class="input-icon">♙</span>
        <input type="password" id="password" name="password" placeholder="Masukan password anda" autocomplete="current-password">
        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Tampilkan password">◉</button>
      </div>
      <small class="error-message" id="passwordError"></small>
    </div>
    <div class="form-options">
      <label class="remember"><input type="checkbox" id="remember"><span class="checkmark"></span></label>
      <a href="#" id="forgotPassword">Lupa password?</a>
    </div>
    <button type="submit" class="login-button" id="loginButton">Login</button>
    <p class="auth-status" id="authStatus" aria-live="polite"></p>
  </form>
  <div class="register"><span>Belum punya akun?</span> <a href="register.html">Daftar sekarang</a></div>
</main>
<script src="login.js"></script>
</body>
</html>
